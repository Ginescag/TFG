
services:
  vllm:
    image: vllm/vllm-openai:latest
    container_name: qwen25-vl-3b
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    shm_size: "8gb"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    ports:
      - "1444:8000"
    ipc: host
    command: >
      --model unsloth/Qwen2.5-VL-3B-Instruct-unsloth-bnb-4bit
      --tokenizer Qwen/Qwen2.5-VL-3B-Instruct
      --served-model-name qwen2.5-vl-3b
      --quantization bitsandbytes
      --load-format bitsandbytes
      --dtype bfloat16
      --max-model-len 32768
      --gpu-memory-utilization 0.8
      --max-num-seqs 4
      --limit-mm-per-prompt '{"image":2}'
      --trust-remote-code
    restart: unless-stopped